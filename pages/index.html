<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivation Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <script src="/pages/app.js"></script>
    <link rel="stylesheet" href="/pages/styles.css">
</head>
<body>

    <div id="tab-market" class="tab-content active">
        <div class="container">
            <h2>Каталог товарів</h2>
            <div id="products-container"></div>
        </div>
    </div>

    <div id="tab-profile" class="tab-content">
        <div class="container">
            <div class="profile-card">
                <h2 id="profile-name">Завантаження...</h2>
                <p id="profile-id">ID: ---</p>
            </div>
            <h3>Мої покупки:</h3>
            <div id="purchases-container"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" id="btn-market" onclick="switchTab('market')">
            <span class="nav-icon">🛒</span>
            <span class="nav-label">Магазин</span>
        </button>
        <button class="nav-item" id="btn-profile" onclick="switchTab('profile')">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Профіль</span>
        </button>
    </nav>

</body>
</html>
